<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b18" />
    <title>오프라인 · CAP</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #071b18; color: #f4f5ef; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
      main { width: min(520px, 100%); padding: 40px; border: 1px solid rgba(217,197,126,.55); background: #0d2b25; }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; border: 1px solid #d9c57e; color: #f4e7ad; font-weight: 800; transform: rotate(45deg); }
      .mark span { transform: rotate(-45deg); }
      h1 { margin: 34px 0 14px; font-size: clamp(30px, 8vw, 48px); letter-spacing: -2px; }
      p { margin: 0; color: #b8c9c3; line-height: 1.8; }
      a { min-height: 48px; display: inline-flex; align-items: center; margin-top: 28px; padding: 0 20px; background: #0d7655; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span>CAP</span></div>
      <h1>현재 오프라인입니다.</h1>
      <p>이전에 열어 본 TOP20과 스크리너 데이터는 앱 캐시에 남아 있을 수 있습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <a href="/stock/">다시 연결하기</a>
    </main>
  </body>
</html>
