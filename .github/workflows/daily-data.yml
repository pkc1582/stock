name: Daily data refresh

on:
  schedule:
    - cron: '10 9 * * 1-5'    # 한국시간 월~금 18:10 — 국내 장 마감 후
    - cron: '10 22 * * 0-4'   # 한국시간 월~금 07:10 — 미국 장 마감 후(W10), 국내 전일 데이터 보완
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compound-asset-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh price and disclosure data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run refresh safety tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate secret configuration
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_API_ENDPOINT: ${{ secrets.STOCK_API_ENDPOINT }}
          STOCK_API_SERVICE_KEY: ${{ secrets.STOCK_API_SERVICE_KEY }}
        run: |
          missing=0
          for name in DART_API_KEY STOCK_API_SERVICE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Fetch official market data
        id: market
        continue-on-error: true
        env:
          STOCK_API_ENDPOINT: ${{ secrets.STOCK_API_ENDPOINT }}
          STOCK_API_SERVICE_KEY: ${{ secrets.STOCK_API_SERVICE_KEY }}
        run: python scripts/fetch_market.py

      - name: Fetch D10 dividend-track quotes
        id: d10
        continue-on-error: true
        env:
          STOCK_API_ENDPOINT: ${{ secrets.STOCK_API_ENDPOINT }}
          STOCK_API_SERVICE_KEY: ${{ secrets.STOCK_API_SERVICE_KEY }}
        run: python scripts/fetch_dividend_quotes.py

      - name: Fetch W10 overseas quotes
        id: w10
        continue-on-error: true
        run: python scripts/fetch_w10_quotes.py

      - name: Fetch OpenDART financial data
        id: dart
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_dart.py

      - name: Build public dataset
        id: build
        if: always() && (steps.market.outcome == 'success' || steps.dart.outcome == 'success')
        run: python scripts/build_dataset.py

      - name: Validate generated JSON
        if: success() && (steps.market.outcome == 'success' || steps.dart.outcome == 'success')
        run: python -m json.tool public/data/latest.json > /dev/null

      - name: Freshness check
        id: freshness
        if: always()
        continue-on-error: true
        run: |
          echo "market=${{ steps.market.outcome }} d10=${{ steps.d10.outcome }} w10=${{ steps.w10.outcome }} dart=${{ steps.dart.outcome }}"
          python scripts/check_freshness.py

      - name: Commit refreshed snapshot
        if: success() && (steps.market.outcome == 'success' || steps.dart.outcome == 'success')
        shell: bash
        run: |
          git add -- data/companies.json public/data/latest.json
          if [ -f public/data/w10.json ]; then git add -- public/data/w10.json; fi
          if [ -f data/dividend-quotes.json ]; then git add -- data/dividend-quotes.json; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "compound-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh daily market snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report refresh result
        if: always()
        shell: bash
        run: |
          market="${{ steps.market.outcome }}"
          dart="${{ steps.dart.outcome }}"
          build="${{ steps.build.outcome }}"
          freshness="${{ steps.freshness.outcome }}"
          if [ "$market" != "success" ]; then
            echo "::warning::Market refresh failed; the last verified prices were preserved."
          fi
          if [ "$dart" != "success" ]; then
            echo "::warning::OpenDART refresh failed; the last verified reports were preserved."
          fi
          if [ "$market" != "success" ] && [ "$dart" != "success" ]; then
            echo "::error::Both official data providers failed. No public snapshot was rebuilt."
            exit 1
          fi
          if [ "$build" != "success" ]; then
            echo "::error::The public dataset could not be rebuilt safely."
            exit 1
          fi
          if [ "$freshness" != "success" ]; then
            echo "::error::Price data freshness check failed; see the Freshness check step log."
            exit 1
          fi
