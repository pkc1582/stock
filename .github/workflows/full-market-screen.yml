name: Full market screener refresh

on:
  schedule:
    # 20:40 KST every Monday (GitHub cron uses UTC). The public feeds publish
    # prior-business-day data after 13:00 KST.
    - cron: "40 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compound-asset-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild full-market pre-screen
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run data safety tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate secret configuration
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_LISTED_API_KEY: ${{ secrets.KRX_LISTED_API_KEY }}
          STOCK_API_SERVICE_KEY: ${{ secrets.STOCK_API_SERVICE_KEY }}
        run: |
          missing=0
          for name in DART_API_KEY KRX_LISTED_API_KEY STOCK_API_SERVICE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Sync KOSPI and KOSDAQ universe
        env:
          KRX_LISTED_API_KEY: ${{ secrets.KRX_LISTED_API_KEY }}
        run: python scripts/sync_universe.py

      - name: Fetch full-market price and liquidity snapshot
        env:
          STOCK_API_ENDPOINT: ${{ secrets.STOCK_API_ENDPOINT }}
          STOCK_API_SERVICE_KEY: ${{ secrets.STOCK_API_SERVICE_KEY }}
        run: python scripts/fetch_market_universe.py

      - name: Fetch OpenDART batch fundamentals
        timeout-minutes: 25
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_screen_financials.py --market data/market-universe.json

      - name: Build auditable quantitative screen
        run: python scripts/build_screener.py

      - name: Validate generated snapshots
        shell: bash
        run: |
          python -m json.tool data/universe.json > /dev/null
          python -m json.tool data/market-universe.json > /dev/null
          python -m json.tool data/screen-financials.json > /dev/null
          python -m json.tool public/data/screener.json > /dev/null

      - name: Commit refreshed screener
        shell: bash
        run: |
          git add -- \
            data/universe.json \
            data/market-universe.json \
            data/screen-financials.json \
            public/data/screener.json

          if git diff --cached --quiet; then
            echo "No full-market screener changes to commit."
            exit 0
          fi

          git config user.name "compound-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh full-market screener"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
